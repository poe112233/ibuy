<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>正在前往 Oriental Essence…</title>
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://oe-brand.app.workbuddy.host/" />
<meta http-equiv="refresh" content="0; url=https://oe-brand.app.workbuddy.host/" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f6f3ee;
    color: #14161c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid #e8e3db;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(20, 22, 28, 0.08);
    padding: 40px 36px;
    max-width: 460px;
    text-align: center;
  }
  .mark {
    width: 46px; height: 46px; margin: 0 auto 18px;
    border-radius: 12px; background: #14161c; color: #e9d9b8;
    display: grid; place-items: center;
    font-size: 15px; font-weight: 700; letter-spacing: .5px;
  }
  h1 { margin: 0 0 8px; font-size: 19px; font-weight: 650; letter-spacing: .2px; }
  p { margin: 0 0 22px; font-size: 13.5px; line-height: 1.7; color: #5b6270; }
  a.btn {
    display: inline-block; text-decoration: none;
    background: #14161c; color: #fff;
    padding: 11px 20px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
  }
  a.btn:hover { opacity: .88; }
  .url { margin-top: 16px; font-size: 12px; color: #9aa1ad; word-break: break-all; }
  .bar { margin: 0 auto 22px; width: 120px; height: 3px; border-radius: 3px; background: #eee9e1; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #b08d57; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
</style>
<script>
  (function () {
    var TARGET = "https://oe-brand.app.workbuddy.host/";
    try { window.location.replace(TARGET); } catch (e) { window.location.href = TARGET; }
  })();
</script>
</head>
<body>
  <div class="card">
    <div class="mark">OE</div>
    <h1>正在前往 Oriental Essence</h1>
    <p>如果没有自动跳转，请点击下面的按钮。</p>
    <div class="bar"><i></i></div>
    <a class="btn" href="https://oe-brand.app.workbuddy.host/">立即前往</a>
    <div class="url">oe-brand.app.workbuddy.host</div>
  </div>
</body>
</html>
